  plots: true
postprocessing:
- plots:
    mesh: true
    m: true
    u: true
    v: true
    p: true
    t: true
    rho: true
    p0: true
    t0: true
    rho0: true
    cl: true
    cd: true
    cp: true
    re: true
fluid:
- name: CPG_Air
  cp: 1005
  cv: 718
  MW: 0.0289647
  reference_viscosity: 1.716e-05
  reference_viscosity_temperature: 273
  reference_viscosity_constant: 111
freestream:
- mach: 3
  angle_of_attack: 5