---
project:
- mesh_path: "../Meshes/demoDiamond.gri"
  restart_files: false
  filename: demoDiamond
inviscid_flux:
- flux_method: roe
  flux_limiter: superbee
adaptation:
- adaptive_cycles: 2
- adaptation_percentage: 0.075
convergence:
- convergence_method: smart
  convergence_minimum: 1.0e-05
